[project]
name = "nia-pcb"
version = "0.1.0"
description = "Application locale pour concevoir une carte fabricable chez JLCPCB."
authors = [
    { name = "Marwichmisi", email = "marwanealimi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[tool.fastapi]
entrypoint = "nia_pcb.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
